<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEX Swap · ChainLens</title>
  <meta name="description" content="Swap tokens on-chain from your own connected wallet, with the same checks Magic Money runs before every signature.">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
  <link rel="shortcut icon" href="/favicon/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --panel-2: #f1f5f9; --border: #e2e8f0;
      --text: #0f172a; --muted: #64748b; --accent: #0891b2; --accent-text: #ffffff;
      --good: #059669; --warn: #b45309; --bad: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #020617; --panel: #0f172a; --panel-2: #020617; --border: #1e293b;
        --text: #f1f5f9; --muted: #94a3b8; --accent: #22d3ee; --accent-text: #020617;
        --good: #34d399; --warn: #fbbf24; --bad: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 'Space Grotesk', system-ui, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    header a { color: var(--muted); text-decoration: none; font-size: 13px; }
    header a:hover { color: var(--accent); }
    .eyebrow { margin: 16px 0 0; font-size: 11px; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 4px 0 6px; font: 800 40px/1.05 'Syne', sans-serif; text-transform: uppercase; }
    .lede { margin: 0 0 20px; color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1 1 160px; min-width: 0; }
    label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    select, input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font: inherit; }
    input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { font: inherit; font-weight: 700; border-radius: 12px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 10px 14px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); width: 100%; padding: 14px; font-size: 16px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .wallet { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .wallet strong { color: var(--text); }
    .results { margin-top: 6px; max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; }
    .results button { display: flex; width: 100%; justify-content: space-between; gap: 8px; border: 0; border-radius: 0; background: transparent; text-align: left; font-weight: 500; }
    .results button:hover { background: var(--panel-2); }
    .results small { color: var(--muted); font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; }
    .token { font-size: 13px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    .note { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
    .msg { padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-top: 10px; background: var(--panel-2); border: 1px solid var(--border); }
    .msg.bad { border-color: var(--bad); color: var(--bad); }
    .msg.good { border-color: var(--good); color: var(--good); }
    .msg.warn { border-color: var(--warn); color: var(--warn); }
    .swap { border-top: 1px solid var(--border); padding: 10px 0; font-size: 14px; }
    .swap:first-child { border-top: 0; }
    .state { font-weight: 700; }
    .state.completed { color: var(--good); }
    .state.partial, .state.refunded, .state.refund-pending, .state.unknown { color: var(--warn); }
    .state.failed { color: var(--bad); }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .hidden { display: none !important; }
    a { color: var(--accent); }
  </style>
  <script src="/chain-catalog.js"></script>
  <script src="/wallet-providers.js"></script>
  <script src="/swap-core.js"></script>
  <script src="/swap-wallet-adapter.js"></script>
  <script src="/dex-swap-store.js"></script>
</head>
<body>
  <main>
    <header>
      <a href="/magic-swap">← Magic Swap (SimpleSwap exchange)</a>
      <p class="eyebrow">Connected-wallet swap</p>
      <h1>DEX Swap</h1>
      <p class="lede">Swap on-chain from your own wallet. Every transaction is checked against the quote you approve, immediately before your wallet asks you to sign it.</p>
    </header>

    <section class="panel" aria-labelledby="wallets-h">
      <label id="wallets-h">Wallets</label>
      <div class="row">
        <div class="grow wallet" data-testid="evm-wallet">EVM: <strong>not connected</strong></div>
        <button type="button" data-action="connect-evm">Connect EVM wallet</button>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="grow wallet" data-testid="solana-wallet">Solana: <strong>not connected</strong></div>
        <button type="button" data-action="connect-solana">Connect Solana wallet</button>
      </div>
      <div class="results hidden" data-testid="provider-picker" role="listbox" aria-label="Choose a wallet"></div>
    </section>

    <section class="panel" aria-label="Swap">
      <div class="row">
        <div class="grow">
          <label for="from-chain">From</label>
          <select id="from-chain" data-testid="from-chain"></select>
        </div>
        <div class="grow">
          <label for="from-search">Token</label>
          <input id="from-search" data-testid="from-search" placeholder="Name, symbol or address" autocomplete="off">
        </div>
      </div>
      <div class="results hidden" data-testid="from-results" role="listbox" aria-label="Tokens to sell"></div>
      <div class="token" data-testid="from-token"></div>
      <div style="margin-top:12px">
        <label for="amount">Amount</label>
        <input id="amount" data-testid="amount" inputmode="decimal" placeholder="0.0" autocomplete="off">
      </div>

      <div class="row" style="margin-top:16px">
        <div class="grow">
          <label for="to-chain">To</label>
          <select id="to-chain" data-testid="to-chain"></select>
        </div>
        <div class="grow">
          <label for="to-search">Token</label>
          <input id="to-search" data-testid="to-search" placeholder="Name, symbol or address" autocomplete="off">
        </div>
      </div>
      <div class="results hidden" data-testid="to-results" role="listbox" aria-label="Tokens to buy"></div>
      <div class="token" data-testid="to-token"></div>

      <div class="row" style="margin-top:12px">
        <div class="grow wallet" data-testid="recipient">Receives at: <strong>—</strong></div>
        <div style="width:130px">
          <label for="slippage">Slippage</label>
          <select id="slippage" data-testid="slippage">
            <option value="50">0.5%</option>
            <option value="100" selected>1%</option>
            <option value="200">2%</option>
            <option value="300">3%</option>
          </select>
        </div>
      </div>
      <div style="margin-top:14px">
        <button type="button" data-action="quote" data-testid="get-quote">Get quote</button>
      </div>
      <div class="msg hidden" data-testid="form-message" role="status"></div>
    </section>

    <section class="panel hidden" data-testid="quote" aria-label="Quote">
      <dl data-testid="quote-details"></dl>
      <p class="note" data-testid="quote-note"></p>
      <div style="margin-top:14px">
        <button type="button" class="primary" data-action="swap" data-testid="swap">Swap</button>
      </div>
      <div class="msg hidden" data-testid="swap-message" role="alert"></div>
    </section>

    <section class="panel" aria-labelledby="history-h">
      <label id="history-h">Your swaps on this device</label>
      <div data-testid="swaps"><p class="note">No swaps yet.</p></div>
    </section>
  </main>
  <script src="/dex-swap.js"></script>
</body>
</html>
